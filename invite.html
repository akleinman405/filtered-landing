            --primary-700: #0F766E;

            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;

        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--gray-800);

            display: flex;

        .container {

            flex: 1;
            display: flex;

            justify-content: center;

        .logo {

            align-items: center;

            margin-bottom: 2rem;

        .logo-icon {

            height: 48px;

            justify-content: center;

            height: 28px;
            color: white;
        }

        .logo-text {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);

        .card {

        .invite-icon {

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 600;
            margin-bottom: 0.5rem;

        .subtitle {

            padding: 1rem;
            margin-bottom: 1.5rem;

        .invite-code-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--gray-500);
            margin-bottom: 0.5rem;

            font-weight: 600;

            color: var(--gray-800);

</head>

    <script>
        const API_BASE = 'https://coparent-shield.fly.dev';

        async function fetchWithTimeout(url, timeoutMs) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                return response;
            } catch (err) {
                clearTimeout(timeoutId);
                throw err;
            }
        }

        async function loadInvite() {
            const urlParams = new URLSearchParams(window.location.search);
            const inviteCode = urlParams.get('code');
            const contentEl = document.getElementById('content');

            if (!inviteCode) {
                contentEl.innerHTML = `
                    <div class="error" role="alert">
                        <strong>Invalid Invite Link</strong>
                        <p>This invite link appears to be incomplete. Please ask the person who invited you to send the link again.</p>
                        <p style="margin-top: 1rem;"><a href="/" aria-label="Visit Filtered homepage">Visit Filtered homepage</a></p>
                    </div>
                `;
                return;
            }

            try {
                const validateUrl = `${API_BASE}/api/connections/invite/${inviteCode}/validate`;
                let response;
                let attempt = 0;

                // Retry logic: first attempt 12s (cold start), retry 8s
                const timeouts = [12000, 8000];

                while (attempt < timeouts.length) {
                    try {
                        if (attempt > 0) {
                            // Show retry message
                            const loadingText = document.getElementById('loading-text');
                            if (loadingText) {
                                loadingText.textContent = 'Waking up server... one moment';
                            }
                        }
                        response = await fetchWithTimeout(validateUrl, timeouts[attempt]);
                        if (response.ok) break;
                        // Non-OK response (e.g. 404 expired invite) — don't retry
                        throw new Error('Invalid or expired invite');
                    } catch (err) {
                        attempt++;
                        if (err.name !== 'AbortError' || attempt >= timeouts.length) {
                            throw err;
                        }
                        // AbortError = timeout, loop will retry
                    }
                }

                if (!response || !response.ok) {
                    throw new Error('Invalid or expired invite');
                }

                let data;
                try {
                    data = await response.json();

                    throw new Error('Invalid response from server');

        function copyInviteCode(code) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(function() {
                    var label = document.getElementById('copy-label');
                    if (label) { label.textContent = 'Copied!'; setTimeout(function() { label.textContent = 'Copy'; }, 2000); }
                }).catch(function() {
                    fallbackCopy(code);
                });
            } else {
                fallbackCopy(code);
            }
        }

        function fallbackCopy(code) {
            var textarea = document.createElement('textarea');
            textarea.value = code;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                var label = document.getElementById('copy-label');
                if (label) { label.textContent = 'Copied!'; setTimeout(function() { label.textContent = 'Copy'; }, 2000); }
            } catch (e) { /* ignore */ }
            document.body.removeChild(textarea);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
