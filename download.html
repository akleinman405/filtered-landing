    <style>
        :root {
            --primary-50: #F0FDFA;
            --primary-100: #CCFBF1;
            --primary-500: #14B8A6;
            --primary-600: #0D9488;
            --primary-700: #0F766E;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-800: #1F2937;
            --gray-900: #111827;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--gray-800);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--primary-50) 0%, white 50%, var(--gray-50) 100%);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        .logo-text {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--gray-900);
        }

        .subtitle {
            color: var(--gray-500);
            margin-bottom: 2rem;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--gray-200, #E5E7EB);
            border-top-color: var(--primary-500);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .play-store-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.4);
        }

        .play-store-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.5);
        }

        .apk-fallback {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-100);
        }

        .apk-fallback a {
            color: var(--gray-500);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .apk-fallback a:hover {
            text-decoration: underline;
            color: var(--primary-600);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--gray-500);
            font-size: 0.875rem;
        }

        footer a {
            color: var(--primary-600);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            .card {
                padding: 1.5rem;
            }
            .play-store-btn {
                width: 100%;
                justify-content: center;
            }
        }

        .skip-link {
            position: absolute;
            left: -9999px;
            top: auto;
            z-index: 9999;
            padding: 8px 16px;
            background: #0D9488;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 0 0 4px 0;
        }
        .skip-link:focus {
            left: 0;
            top: 0;
            outline: 3px solid #111827;
        }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <div id="main" class="container">
        <div class="logo">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                </svg>
            </div>
            <span class="logo-text">Filtered</span>
        </div>

        <div class="card">
            <div class="spinner"></div>
            <h1>Taking you to Google Play...</h1>
            <p class="subtitle">You'll be redirected automatically.</p>

            <a href="https://play.google.com/store/apps/details?id=com.filteredapp.app" class="play-store-btn" id="play-store-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="24" height="24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                Get it on Google Play
            </a>

            <div class="apk-fallback">
                <a href="/filtered-v1.5.10.apk">Need the APK instead? Download v1.5.10</a>
            </div>
        </div>
    </div>

    <script>
        // JS redirect as backup for meta refresh
        setTimeout(function() {
            window.location.href = 'https://play.google.com/store/apps/details?id=com.filteredapp.app';
        }, 2000);
    </script>

    <footer>
        <a href="/">Back to Home</a> &bull;
        <a href="/privacy.html">Privacy Policy</a> &bull;
        <a href="/terms.html">Terms of Service</a> &bull;
        <a href="/do-not-sell.html">Do Not Sell My Info</a>

</html>
