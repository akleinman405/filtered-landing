<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="3;url=https://play.google.com/store/apps/details?id=com.filteredapp.app">
    <title>Filtered is Live! - Filtered</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0D9488 0%, #0F766E 100%);
            padding: 20px;
        }
        .success-box {
            background: white;
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }
        .check-icon {
            width: 80px;
            height: 80px;
            background: #0D9488;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .check-icon svg {
            width: 40px;
            height: 40px;
            color: white;
        }
        h1 {
            font-size: 32px;
            color: #111827;
            margin-bottom: 16px;
        }
        p {
            font-size: 18px;
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .back-link {
            display: inline-block;
            background: #0D9488;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .back-link:hover {
            background: #0F766E;
        }
        .skip-link {
            position: absolute;
            left: -9999px;
            top: auto;
            z-index: 9999;
            padding: 8px 16px;
            background: #0D9488;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 0 0 4px 0;
        }
        .skip-link:focus {
            left: 0;
            top: 0;
            outline: 3px solid #111827;
        }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <div id="main" class="success-box">
        <div class="check-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h1>Filtered is Live!</h1>
        <p>Great news — Filtered is now available on Google Play. Redirecting you...</p>
        <a href="https://play.google.com/store/apps/details?id=com.filteredapp.app" class="back-link">Get it on Google Play</a>
    </div>
</body>
</html>
