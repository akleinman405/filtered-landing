<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>

    <!-- Subtle pattern overlay -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative shapes -->
  <circle cx="1100" cy="100" r="200" fill="white" opacity="0.05"/>
  <circle cx="100" cy="530" r="150" fill="white" opacity="0.05"/>

  <!-- Funnel Icon Container -->
  <g transform="translate(480, 80)">
    <!-- Outer rounded rectangle background -->
    <rect x="0" y="0" width="240" height="240" rx="40" fill="white" opacity="0.95"/>
    <!-- Inner teal background -->
    <rect x="20" y="20" width="200" height="200" rx="30" fill="#0D9488"/>
    <!-- Funnel icon - OUTLINE style to match app -->
    <g transform="translate(50, 50) scale(6.7)">
      <path fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
    </g>
  </g>

  <!-- App Name -->
  <text x="600" y="400"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="72"
        font-weight="700"
        fill="white"
        text-anchor="middle">
    Filtered
  </text>

  <!-- Tagline -->
  <text x="600" y="470"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="28"
        font-weight="400"
        fill="white"
        opacity="0.9"
        text-anchor="middle">
    Protect your peace while staying connected
  </text>

  <!-- Subtitle -->
  <text x="600" y="520"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="20"
        font-weight="500"
        fill="white"
        opacity="0.7"
        text-anchor="middle">
    AI-Powered Co-Parent Communication
  </text>
</svg>
