<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
      <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0F766E"/>
        <stop offset="100%" style="stop-color:#0D9488"/>
      </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#tealGradient)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>

  <!-- Decorative circles -->
  <circle cx="1000" cy="80" r="150" fill="white" opacity="0.03"/>
  <circle cx="80" cy="1000" r="100" fill="white" opacity="0.03"/>

  <!-- Quote Text -->
  <text x="540" y="335"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="56"
        font-weight="700"
        fill="white"
        text-anchor="middle">Brief.</text>
  <text x="540" y="405"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="56"
        font-weight="700"
        fill="white"
        text-anchor="middle">Informative.</text>
  <text x="540" y="475"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="56"
        font-weight="700"
        fill="white"
        text-anchor="middle">Friendly.</text>
  <text x="540" y="545"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="56"
        font-weight="700"
        fill="white"
        text-anchor="middle">Firm.</text>
  <text x="540" y="685"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="56"
        font-weight="400"
        fill="white"
        text-anchor="middle">Your new communication</text>
  <text x="540" y="755"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="56"
        font-weight="700"
        fill="white"
        text-anchor="middle">framework.</text>

</svg>