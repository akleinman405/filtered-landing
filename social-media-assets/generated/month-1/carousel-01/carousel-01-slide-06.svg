<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
      <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0F766E"/>
        <stop offset="100%" style="stop-color:#0D9488"/>
      </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#tealGradient)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  
  <!-- Decorative -->
  <circle cx="1020" cy="60" r="120" fill="white" opacity="0.03"/>
  <circle cx="60" cy="1290" r="80" fill="white" opacity="0.03"/>

  <!-- Content -->
  <text x="540" y="439.8"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">The original message is</text>
  <text x="540" y="498.6"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">always there if you need it.</text>
  <text x="540" y="616.2"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">For documentation.</text>
  <text x="540" y="675"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">For your records.</text>
  <text x="540" y="792.5999999999999"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">But you don&apos;t have to absorb</text>
  <text x="540" y="851.4"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">the hostility to get the information.</text>

</svg>