<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
      <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0F766E"/>
        <stop offset="100%" style="stop-color:#0D9488"/>
      </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#tealGradient)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  
  <!-- Decorative -->
  <circle cx="1020" cy="60" r="120" fill="white" opacity="0.03"/>
  <circle cx="60" cy="1290" r="80" fill="white" opacity="0.03"/>

  <!-- Large Letter -->
  <text x="540" y="419.8"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="140"
        font-weight="900"
        fill="#FFFFFF"
        opacity="0.15"
        text-anchor="middle">B</text>
  <text x="540" y="459.8"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="36"
        font-weight="700"
        fill="#FFFFFF"
        text-anchor="middle">B = Brief</text>
  <!-- Content -->
  <text x="540" y="499.8"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">Keep it short. One paragraph</text>
  <text x="540" y="558.6"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">max—often one sentence is better.</text>
  <text x="540" y="676.2"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">Long explanations invite debate.</text>
  <text x="540" y="735"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">Short responses end conversations.</text>
  <text x="120" y="852.5999999999999"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="36"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="start">✗ &quot;I understand you&apos;re frustrated...&quot;</text>
  <text x="120" y="911.4"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="36"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="start">✓ &quot;I can do 5pm pickup.&quot;</text>

</svg>