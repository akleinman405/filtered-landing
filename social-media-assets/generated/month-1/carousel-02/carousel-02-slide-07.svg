<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
      <linearGradient id="softTealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#14B8A6"/>
        <stop offset="100%" style="stop-color:#0D9488"/>
      </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#softTealGradient)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  
  <!-- Decorative -->
  <circle cx="1020" cy="60" r="120" fill="white" opacity="0.03"/>
  <circle cx="60" cy="1290" r="80" fill="white" opacity="0.03"/>

  <!-- Content -->
  <text x="540" y="322.20000000000005"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">BIFF in action:</text>
  <text x="540" y="439.80000000000007"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">They send: A 3-paragraph message</text>
  <text x="540" y="498.6"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">about everything you&apos;ve done wrong,</text>
  <text x="540" y="557.4000000000001"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">ending with a schedule change.</text>
  <text x="540" y="675"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">Your BIFF response:</text>
  <text x="540" y="792.6"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="38"
        font-weight="500"
        fill="#FFFFFF"
        opacity="0.95"
        text-anchor="middle">&quot;Thanks for letting me know.</text>
  <text x="540" y="851.4"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">5pm works. See you then.&quot;</text>
  <text x="540" y="969"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="400"
        fill="#FFFFFF"
        opacity="1"
        text-anchor="middle">That&apos;s it.</text>

</svg>