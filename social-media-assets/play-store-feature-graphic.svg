  </text>

  <!-- Features -->
  <g transform="translate(380, 370)" fill="white" opacity="0.85" font-family="Inter, -apple-system, sans-serif" font-size="14">
    <text x="0" y="0">Filter hostility</text>
    <text x="0" y="0" dx="130">|</text>
    <text x="0" y="0" dx="150">AI summaries</text>
    <text x="0" y="0" dx="280">|</text>
    <text x="0" y="0" dx="300">Court-ready docs</text>
